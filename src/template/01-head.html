<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob: 'wasm-unsafe-eval'; worker-src blob:; style-src 'unsafe-inline'; img-src data: blob:; font-src data: blob:; connect-src https://api.github.com https://fastly.jsdelivr.net https://gcore.jsdelivr.net https://testingcf.jsdelivr.net blob:; frame-src blob:; media-src blob: data:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Qelemchi — 一个单 HTML 文件、以 GitHub 为存储层的 LaTeX 论文工作台。">
<title>Qelemchi · 把论文写在 GitHub 上</title>
<style>/*__STYLES__*/</style>
</head>
<body>
<div class="boot" id="boot">
  <div class="boot-mark" aria-hidden="true">
    <svg viewBox="0 0 40 40" fill="none"><path d="M9 4.5h16.5L33 12v23.5H9z" stroke="currentColor" stroke-width="1.4"/><path d="M25.5 4.5V12H33" stroke="currentColor" stroke-width="1.4"/><path d="M14 19h14M14 23.5h11M14 28h8" stroke="currentColor" stroke-width="1.2" opacity=".55"/><path d="M27.5 4.5v12L24 14l-3.5 2.5v-12" fill="var(--accent)"/></svg>
  </div>
  <div class="boot-name">Qelemchi</div>
  <div class="boot-status" id="boot-status">正在恢复工作区</div>
  <div class="boot-line"><i></i></div>
</div>

<div class="app" id="app" hidden>
  <header class="topbar">
    <a class="brand" href="#" id="brand-home" title="Qelemchi 首页" aria-label="Qelemchi 首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none"><path d="M9 4.5h16.5L33 12v23.5H9z" stroke="currentColor" stroke-width="1.4"/><path d="M25.5 4.5V12H33" stroke="currentColor" stroke-width="1.4"/><path d="M14 19h14M14 23.5h11M14 28h8" stroke="currentColor" stroke-width="1.2" opacity=".55"/><path d="M27.5 4.5v12L24 14l-3.5 2.5v-12" fill="var(--accent)"/></svg>
      </span>
      <span class="brand-name">Qelemchi</span>
    </a>

    <div class="project-id">
      <span class="project-title" id="project-title">未命名论文</span>
      <button class="repo-pill" id="repo-pill" type="button" title="打开 GitHub 仓库">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span id="repo-pill-text">示例项目</span>
      </button>
    </div>

    <div class="topbar-spacer"></div>

    <div class="top-actions">
      <button class="icon-btn mobile-only" id="btn-sidebar" type="button" aria-label="打开文件列表" title="文件列表">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
      </button>
      <div class="mobile-switch" id="mobile-switch" hidden>
        <button type="button" data-mobile-pane="editor" class="active">编辑</button>
        <button type="button" data-mobile-pane="preview">预览</button>
      </div>
      <button class="icon-btn" id="btn-history" type="button" aria-label="版本历史" title="版本历史">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.2 8.2A7 7 0 1 1 4 13"/><path d="M3 3.5v4.8h4.8"/><path d="M10 6.2V10l2.6 1.6"/></svg>
      </button>
      <button class="icon-btn" id="btn-theme" type="button" aria-label="切换明暗主题" title="切换明暗主题">
        <svg class="icon-sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="10" r="3.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.35 4.35l1.4 1.4M14.25 14.25l1.4 1.4M15.65 4.35l-1.4 1.4M5.75 14.25l-1.4 1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M16.5 12.4A6.7 6.7 0 0 1 7.6 3.5a6.8 6.8 0 1 0 8.9 8.9Z"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" type="button" aria-label="设置" title="设置">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="10" r="2.6"/><path d="M16.2 11.5a6.7 6.7 0 0 0 0-3l1.5-1.1-1.6-2.8-1.8.7a6.9 6.9 0 0 0-2.6-1.5L11.4 2H8.6l-.3 1.8a6.9 6.9 0 0 0-2.6 1.5l-1.8-.7L2.3 7.4l1.5 1.1a6.7 6.7 0 0 0 0 3l-1.5 1.1 1.6 2.8 1.8-.7a6.9 6.9 0 0 0 2.6 1.5l.3 1.8h2.8l.3-1.8a6.9 6.9 0 0 0 2.6-1.5l1.8.7 1.6-2.8-1.5-1.1Z"/></svg>
      </button>
      <span class="topbar-rule" aria-hidden="true"></span>
      <button class="btn btn-soft" id="btn-save" type="button" title="提交到 GitHub (⌘S)">
        <span class="save-dot" id="save-dot"></span>
        <span>提交</span>
        <kbd>⌘S</kbd>
      </button>
      <button class="btn btn-primary" id="btn-compile" type="button" title="编译真实 PDF">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4.2 15 10l-9 5.8V4.2Z"/></svg>
        <span>编译 PDF</span>
      </button>
      <button class="avatar-btn" id="btn-account" type="button" aria-label="账户菜单" title="账户">
        <span id="avatar-initials">TF</span>
      </button>
    </div>
  </header>

  <div class="banner banner-offline" id="offline-banner" hidden>
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 13.5a4 4 0 0 1 .6-7.95A6 6 0 0 1 15.5 7a3.5 3.5 0 0 1 .9 6.9"/><path d="m3 17 14-14"/></svg>
    <span id="offline-text">无法连接 GitHub，修改已保存在本机。</span>
    <button class="text-btn" id="offline-retry" type="button">重试</button>
  </div>

  <div class="banner banner-demo" id="demo-banner">
    <span class="banner-kicker">示例项目</span>
    <span>修改只保存在这台设备。连接 GitHub 后即可获得版本历史与真实 PDF 编译。</span>
    <button class="text-btn" id="demo-connect" type="button">连接仓库 →</button>
    <button class="icon-btn banner-close" id="demo-dismiss" type="button" aria-label="关闭提示">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m4 4 8 8M12 4l-8 8"/></svg>
    </button>
  </div>

  <div class="workspace" id="workspace" data-mobile-pane="editor">
    <aside class="sidebar" id="sidebar">
      <div class="side-tabs" role="tablist" aria-label="侧栏">
        <button type="button" class="side-tab active" data-side-tab="files" role="tab" aria-selected="true">文件</button>
        <button type="button" class="side-tab" data-side-tab="outline" role="tab" aria-selected="false">大纲</button>
        <button type="button" class="side-tab" data-side-tab="search" role="tab" aria-selected="false">搜索</button>
        <span class="side-tab-line" aria-hidden="true"></span>
      </div>
      <div class="side-panes">
        <section class="side-pane" data-side-pane="files">
          <div class="pane-head">
            <span class="eyebrow">PROJECT</span>
            <div class="pane-actions">
              <button type="button" class="icon-btn xs" data-file-action="new" title="新建文件" aria-label="新建文件">
                <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 3.5v11M3.5 9h11"/></svg>
              </button>
              <button type="button" class="icon-btn xs" data-file-action="folder" title="新建文件夹" aria-label="新建文件夹">
                <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 5.5h5l1.5 2h6.5v7h-13z"/><path d="M9 10.5v3M7.5 12h3"/></svg>
              </button>
              <button type="button" class="icon-btn xs" data-file-action="upload" title="上传文件" aria-label="上传文件">
                <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 12V3.5M5.8 6.3 9 3l3.2 3.3"/><path d="M3.5 11v3.5h11V11"/></svg>
              </button>
              <button type="button" class="icon-btn xs" data-file-action="refresh" title="从 GitHub 刷新" aria-label="刷新">
                <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M14.5 7.2A5.5 5.5 0 1 0 14.7 11"/><path d="M14.5 3.5v3.8h-3.8"/></svg>
              </button>
            </div>
          </div>
          <div class="file-tree" id="file-tree" role="tree" aria-label="项目文件"></div>
          <div class="side-foot">
            <div class="storage-card">
              <div class="storage-top">
                <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
                <span id="storage-repo">本机示例</span>
                <span class="storage-badge" id="storage-badge">LOCAL</span>
              </div>
              <div class="storage-sub" id="storage-sub">修改自动保存在浏览器</div>
              <button class="text-btn" id="btn-connect" type="button">连接 GitHub 仓库 →</button>
            </div>
          </div>
        </section>

        <section class="side-pane" data-side-pane="outline" hidden>
          <div class="pane-head">
            <span class="eyebrow">OUTLINE</span>
            <span class="pane-count" id="outline-count"></span>
          </div>
          <div class="outline-list" id="outline-list"></div>
        </section>

        <section class="side-pane" data-side-pane="search" hidden>
          <div class="pane-head">
            <span class="eyebrow">FIND IN PROJECT</span>
            <span class="pane-count" id="search-count"></span>
          </div>
          <div class="side-search">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5"/><path d="m12 12 3 3"/></svg>
            <input type="search" id="project-search" placeholder="搜索所有文件…" autocomplete="off" spellcheck="false">
            <kbd>⌘⇧F</kbd>
          </div>
          <div class="search-results" id="search-results">
            <div class="pane-empty">输入关键词，搜索项目中的全部文本文件。</div>
          </div>
        </section>
      </div>
    </aside>

    <div class="resizer" id="resizer-left" data-resizer="left" role="separator" aria-orientation="vertical" aria-label="调整侧栏宽度"></div>

    <main class="editor-pane" id="editor-pane">
      <div class="editor-head">
        <div class="file-tabs" id="file-tabs" role="tablist" aria-label="打开的文件"></div>
        <div class="segmented editor-mode" id="editor-mode-tabs" role="tablist" aria-label="编辑模式">
          <button type="button" class="active" data-mode="source" role="tab" aria-selected="true" title="编辑 LaTeX 源码">源码</button>
          <button type="button" data-mode="wysiwyg" role="tab" aria-selected="false" title="所见即所得编辑">所见即所得</button>
        </div>
        <button class="icon-btn xs editor-overflow" id="btn-file-actions" type="button" aria-label="文件操作" title="文件操作">
          <svg viewBox="0 0 18 18" fill="currentColor"><circle cx="4" cy="9" r="1.2"/><circle cx="9" cy="9" r="1.2"/><circle cx="14" cy="9" r="1.2"/></svg>
        </button>
      </div>
      <div class="formatbar" id="formatbar">
        <div class="format-group">
          <button type="button" class="fmt-btn" data-format="bold" title="粗体 (⌘B)" aria-label="粗体"><b>B</b></button>
          <button type="button" class="fmt-btn" data-format="italic" title="斜体 (⌘I)" aria-label="斜体"><i>I</i></button>
          <button type="button" class="fmt-btn" data-format="emph" title="强调" aria-label="强调"><i class="fmt-em">e</i></button>
          <button type="button" class="fmt-btn" data-format="code" title="等宽" aria-label="等宽"><span class="fmt-mono">tt</span></button>
          <button type="button" class="fmt-btn" data-format="link" title="超链接" aria-label="超链接">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7.2 10.8 10.8 7.2"/><path d="M6 8.4 4.6 9.8a2.6 2.6 0 0 0 3.7 3.7l1.4-1.4"/><path d="m12 9.6 1.4-1.4a2.6 2.6 0 0 0-3.7-3.7L8.3 5.9"/></svg>
          </button>
        </div>
        <span class="format-rule"></span>
        <div class="format-group">
          <button type="button" class="fmt-btn" data-format="section" title="章节" aria-label="章节"><span class="fmt-section">§</span></button>
          <button type="button" class="fmt-btn" data-format="math" title="行内公式" aria-label="行内公式"><span class="fmt-math">∑</span></button>
          <button type="button" class="fmt-btn" data-format="equation" title="编号公式" aria-label="编号公式"><span class="fmt-eq">=</span></button>
          <button type="button" class="fmt-btn" data-format="cite" title="引用文献" aria-label="引用文献">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4h4v5H5a3 3 0 0 0 3 3M10 4h4v5h-3a3 3 0 0 0 3 3"/></svg>
          </button>
          <button type="button" class="fmt-btn" data-format="ref" title="交叉引用" aria-label="交叉引用"><span class="fmt-ref">↗</span></button>
          <button type="button" class="fmt-btn" data-format="figure" title="插入图" aria-label="插入图">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="3.5" width="13" height="11" rx="1"/><circle cx="6.5" cy="7" r="1.2"/><path d="m3 13 4-4 3 3 2-2 3 3"/></svg>
          </button>
          <button type="button" class="fmt-btn" data-format="table" title="插入表" aria-label="插入表">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="3.5" width="13" height="11" rx="1"/><path d="M2.5 7h13M7 7v7.5M11.5 7v7.5"/></svg>
          </button>
          <button type="button" class="fmt-btn" data-format="list" title="列表" aria-label="列表">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 5h8M7 9h8M7 13h8"/><circle cx="3.6" cy="5" r=".7" fill="currentColor"/><circle cx="3.6" cy="9" r=".7" fill="currentColor"/><circle cx="3.6" cy="13" r=".7" fill="currentColor"/></svg>
          </button>
          <button type="button" class="fmt-btn" data-format="comment" title="注释 (⌘/)" aria-label="注释"><span class="fmt-comment">%</span></button>
        </div>
        <span class="format-rule"></span>
        <button type="button" class="insert-menu-btn" id="btn-insert" aria-haspopup="true" aria-expanded="false">
          <span>插入</span>
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="m3 4.5 3 3 3-3"/></svg>
        </button>
        <div class="formatbar-spacer"></div>
        <button type="button" class="fmt-btn fmt-palette" id="btn-palette" title="命令面板 (⌘K)" aria-label="命令面板">
          <kbd>⌘K</kbd>
        </button>
      </div>
      <div class="editor-wrap" id="editor-wrap">
        <textarea id="editor-fallback" spellcheck="false" aria-label="LaTeX 源码"></textarea>
        <div id="editor" class="editor-host"></div>
        <div id="wysiwyg" class="wysiwyg-host" aria-label="所见即所得编辑器" hidden></div>
        <div class="editor-drop" id="editor-drop" hidden><span>松开以上传文件</span></div>
      </div>
      <div class="editor-foot">
        <span class="editor-save" id="save-state"><i class="state-dot"></i><span>本机草稿</span></span>
        <span class="editor-file-meta" id="editor-file-meta"></span>
      </div>
    </main>

    <div class="resizer" id="resizer-right" data-resizer="right" role="separator" aria-orientation="vertical" aria-label="调整预览宽度"></div>

    <section class="preview-pane" id="preview-pane">
      <div class="preview-head">
        <div class="preview-view-label" title="预览始终显示编译后的真实 PDF">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4.5 2.5h6l3 3v10h-9z"/><path d="M10.5 2.5v3h3"/><path d="M6.5 11.5h5M6.5 8.5h3"/></svg>
          <span>PDF</span>
        </div>
        <div class="preview-meta">
          <span id="page-count">0 页</span>
          <span class="meta-dot">·</span>
          <span id="preview-state">就绪</span>
        </div>
        <div class="preview-spacer"></div>
        <div class="preview-actions">
          <button type="button" class="icon-btn xs" id="btn-zoom-out" aria-label="缩小" title="缩小">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9h10"/></svg>
          </button>
          <button type="button" class="zoom-label" id="btn-zoom-reset" title="重置缩放">100%</button>
          <button type="button" class="icon-btn xs" id="btn-zoom-in" aria-label="放大" title="放大">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9h10M9 4v10"/></svg>
          </button>
          <button type="button" class="icon-btn xs" id="btn-fit" aria-label="适合宽度" title="适合宽度">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 6V3h3M12 3h3v3M15 12v3h-3M6 15H3v-3"/><path d="M6 9h6"/></svg>
          </button>
          <span class="preview-rule"></span>
          <button type="button" class="icon-btn xs" id="btn-preview-refresh" aria-label="重新编译 PDF" title="重新编译 PDF">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M14.5 7.2A5.5 5.5 0 1 0 14.7 11"/><path d="M14.5 3.5v3.8h-3.8"/></svg>
          </button>
          <button type="button" class="icon-btn xs" id="btn-preview-more" aria-label="更多预览操作" title="更多">
            <svg viewBox="0 0 18 18" fill="currentColor"><circle cx="4" cy="9" r="1.2"/><circle cx="9" cy="9" r="1.2"/><circle cx="14" cy="9" r="1.2"/></svg>
          </button>
        </div>
      </div>
      <div class="preview-stage" id="preview-stage">
        <div class="pdf-stage" id="pdf-stage">
          <div class="pdf-canvas" id="pdf-canvas" hidden></div>
          <iframe id="pdf-frame" title="编译后的 PDF"></iframe>
          <div class="pdf-status" id="pdf-status" hidden>
            <span class="typeset-spinner" aria-hidden="true"></span>
            <span id="pdf-status-text">正在浏览器内编译 PDF…</span>
            <small id="pdf-status-detail"></small>
          </div>
        </div>
        <div class="preview-empty" id="preview-empty" hidden></div>
        <div class="preview-error" id="preview-error" hidden></div>
      </div>
      <div class="issue-strip" id="issue-strip" hidden>
        <button type="button" id="issue-toggle">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 2.5 16.5 15h-15L9 2.5Z"/><path d="M9 7v3.4M9 13v.1"/></svg>
          <span id="issue-label">0 条排版提示</span>
          <svg class="issue-chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="m3 4.5 3 3 3-3"/></svg>
        </button>
        <div class="issue-popover" id="issue-popover" hidden></div>
      </div>
    </section>
  </div>

  <footer class="statusbar">
